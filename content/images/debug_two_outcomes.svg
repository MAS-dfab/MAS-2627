<svg width="100%" viewBox="0 0 400 244" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Two ways code can end</title>
  <desc>Two outcomes side by side: code that stops with an error, and code that runs and is silently wrong. The second one is highlighted.</desc>
  <style>
    .ink   { fill: #1A1A1A; }
    .muted { fill: #6B6B6B; }
    .wire  { stroke: #6B6B6B; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #FFFFFF; }
      .muted { fill: #FFFFFF; }
      .wire  { stroke: #9A9A95; }
    }
  </style>
  <defs>
    <marker id="dbgArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="wire" d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="200" y="22" text-anchor="middle" font-size="13" font-weight="500" class="ink" fill="#1A1A1A">Two ways code can end</text>
  <rect x="37" y="48" width="156" height="30" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="115" y="63" text-anchor="middle" dominant-baseline="central" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">print(&quot;*&quot; * &quot;15&quot;)</text>
  <line class="wire" x1="115" y1="78" x2="115" y2="100" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#dbgArrow)"/>
  <rect x="53" y="104" width="124" height="36" rx="18" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="115" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">it stops</text>
  <text x="115" y="164" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">It refuses, and says why.</text>
  <text x="115" y="180" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">Loud. The easiest kind.</text>
  <rect x="207" y="48" width="156" height="30" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="285" y="63" text-anchor="middle" dominant-baseline="central" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">spaces = &quot; &quot; * i</text>
  <line class="wire" x1="285" y1="78" x2="285" y2="100" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#dbgArrow)"/>
  <rect x="223" y="104" width="124" height="36" rx="18" fill="#E8E6F8" stroke="#B0A9E8" stroke-width="0.5"/>
  <text x="285" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#43399B">it runs</text>
  <text x="285" y="164" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">No error. Wrong shape.</text>
  <text x="285" y="180" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">This one is dangerous.</text>
  <path class="wire" d="M40 204 L360 204" fill="none" stroke="#6B6B6B" stroke-width="1.5"/>
  <text x="200" y="226" text-anchor="middle" dominant-baseline="central" font-size="11" class="ink" fill="#1A1A1A">Code that runs and is wrong is worse than code that crashes.</text>
</svg>
