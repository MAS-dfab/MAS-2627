<svg width="100%" viewBox="0 0 260 330" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <style>
    .ink   { fill: #1A1A1A; }
    .muted { fill: #6B6B6B; }
    .wire  { stroke: #6B6B6B; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #FFFFFF; }
      .muted { fill: #FFFFFF; }
      .wire  { stroke: #9A9A95; }
    }
  </style>
  <title>Sequence</title>
  <desc>A start terminator leading through two process steps to an end terminator, in a single line.</desc>
  <defs>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="wire" d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="130" y="20" text-anchor="middle" font-size="13" font-weight="500" class="ink" fill="#1A1A1A">Sequence</text>

  <rect x="80" y="42" width="100" height="36" rx="18" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="130" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">start</text>

  <rect x="70" y="112" width="120" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="130" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">step one</text>

  <rect x="70" y="192" width="120" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="130" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">step two</text>

  <rect x="80" y="272" width="100" height="36" rx="18" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="130" y="290" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">end</text>

  <line class="wire" x1="130" y1="78" x2="130" y2="108" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <line class="wire" x1="130" y1="156" x2="130" y2="188" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <line class="wire" x1="130" y1="236" x2="130" y2="268" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#seqArrow)"/>
</svg>
