<svg width="100%" viewBox="0 0 390 310" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The counter starts talking</title>
  <desc>Five passes of one rule: the counter i feeds the expression, and each pass prints a row one star longer than the last.</desc>
  <style>
    .ink   { fill: #1A1A1A; }
    .muted { fill: #6B6B6B; }
    .wire  { stroke: #6B6B6B; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #FFFFFF; }
      .muted { fill: #FFFFFF; }
      .wire  { stroke: #9A9A95; }
    }
  </style>
  <defs>
    <marker id="cntArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="wire" d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="195" y="22" text-anchor="middle" font-size="13" font-weight="500" class="ink" fill="#1A1A1A">The counter starts talking</text>
  <text x="54" y="50" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">the counter</text>
  <text x="160" y="50" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">the rule</text>
  <text x="300" y="50" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">what gets printed</text>
  <rect x="24" y="69" width="60" height="26" rx="13" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="54" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">i = 0</text>
  <line class="wire" x1="84" y1="82" x2="102" y2="82" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="160" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">&quot;*&quot; * 0</text>
  <line class="wire" x1="218" y1="82" x2="244" y2="82" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="300" y="82" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">(an empty row)</text>
  <rect x="24" y="107" width="60" height="26" rx="13" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="54" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">i = 1</text>
  <line class="wire" x1="84" y1="120" x2="102" y2="120" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="160" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">&quot;*&quot; * 1</text>
  <line class="wire" x1="218" y1="120" x2="244" y2="120" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="300" y="120" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">*</text>
  <rect x="24" y="145" width="60" height="26" rx="13" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="54" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">i = 2</text>
  <line class="wire" x1="84" y1="158" x2="102" y2="158" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="160" y="158" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">&quot;*&quot; * 2</text>
  <line class="wire" x1="218" y1="158" x2="244" y2="158" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="300" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">**</text>
  <rect x="24" y="183" width="60" height="26" rx="13" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="54" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">i = 3</text>
  <line class="wire" x1="84" y1="196" x2="102" y2="196" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="160" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">&quot;*&quot; * 3</text>
  <line class="wire" x1="218" y1="196" x2="244" y2="196" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="300" y="196" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">***</text>
  <rect x="24" y="221" width="60" height="26" rx="13" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="54" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">i = 4</text>
  <line class="wire" x1="84" y1="234" x2="102" y2="234" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="160" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">&quot;*&quot; * 4</text>
  <line class="wire" x1="218" y1="234" x2="244" y2="234" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cntArrow)"/>
  <text x="300" y="234" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">****</text>
  <text x="195" y="288" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">One rule, five passes. Nobody drew a triangle.</text>
</svg>
