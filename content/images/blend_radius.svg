<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760" height="305" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

  <!-- ============ Panel A : r = 0 ============ -->
  <g transform="translate(30,60)">
    <text x="82" y="-38" fill="#8a8f98" font-size="14" font-weight="600" text-anchor="middle">r = 0</text>

    <!-- commanded polyline -->
    <polyline points="15,20 150,20 150,155" fill="none" stroke="#8a8f98" stroke-width="1.5"
              stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- actual tool path (identical to the commanded one) -->
    <polyline points="15,20 150,20 150,155" fill="none" stroke="#e0821a" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150,163 L144.5,150 L155.5,150 Z" fill="#e0821a"/>

    <!-- waypoints -->
    <circle cx="15"  cy="20"  r="4" fill="#8a8f98"/>
    <circle cx="150" cy="20"  r="4" fill="#8a8f98"/>
    <circle cx="150" cy="155" r="4" fill="#8a8f98"/>

    <!-- stop marker at the corner -->
    <circle cx="150" cy="20" r="11" fill="none" stroke="#e0821a" stroke-width="1.5"/>
    <text x="158" y="10" fill="#e0821a" font-size="12">v = 0</text>

    <text x="82" y="185" fill="#8a8f98" font-size="12" text-anchor="middle">exact corner</text>
    <text x="82" y="202" fill="#8a8f98" font-size="12" text-anchor="middle">robot stops dead at the waypoint</text>
  </g>

  <!-- ============ Panel B : r = 40 ============ -->
  <g transform="translate(280,60)">
    <text x="82" y="-38" fill="#8a8f98" font-size="14" font-weight="600" text-anchor="middle">r = 40 mm</text>

    <!-- blend sphere -->
    <circle cx="150" cy="20" r="40" fill="none" stroke="#8a8f98" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>

    <!-- commanded polyline -->
    <polyline points="15,20 150,20 150,155" fill="none" stroke="#8a8f98" stroke-width="1.5"
              stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- actual tool path: leaves the line r before the corner, rejoins r after -->
    <path d="M15,20 L110,20 A40,40 0 0 1 150,60 L150,155" fill="none" stroke="#e0821a" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150,163 L144.5,150 L155.5,150 Z" fill="#e0821a"/>

    <!-- radius annotation: corner -> departure point -->
    <line x1="110" y1="20" x2="150" y2="20" stroke="#e0821a" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="110" y1="14" x2="110" y2="26" stroke="#e0821a" stroke-width="1"/>
    <text x="130" y="-8" fill="#e0821a" font-size="12" text-anchor="middle">r</text>
    <line x1="130" y1="-2" x2="130" y2="14" stroke="#e0821a" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- deviation -->
    <line x1="150" y1="20" x2="138.3" y2="31.7" stroke="#e0821a" stroke-width="1"/>
    <text x="168" y="44" fill="#e0821a" font-size="12">≈ 0.41 r</text>
    <line x1="140" y1="38" x2="165" y2="40" stroke="#e0821a" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- waypoints -->
    <circle cx="15"  cy="20"  r="4" fill="#8a8f98"/>
    <circle cx="150" cy="20"  r="4" fill="#8a8f98"/>
    <circle cx="150" cy="155" r="4" fill="#8a8f98"/>

    <text x="82" y="185" fill="#8a8f98" font-size="12" text-anchor="middle">blended corner</text>
    <text x="82" y="202" fill="#8a8f98" font-size="12" text-anchor="middle">never stops, never reaches the waypoint</text>
  </g>

  <!-- ============ Panel C : r clamped ============ -->
  <g transform="translate(530,60)">
    <text x="82" y="-38" fill="#8a8f98" font-size="14" font-weight="600" text-anchor="middle">r = 67.5 mm (clamped)</text>

    <circle cx="150" cy="20" r="67.5" fill="none" stroke="#8a8f98" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>

    <polyline points="15,20 150,20 150,155" fill="none" stroke="#8a8f98" stroke-width="1.5"
              stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M15,20 L82.5,20 A67.5,67.5 0 0 1 150,87.5 L150,155" fill="none" stroke="#e0821a" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150,163 L144.5,150 L155.5,150 Z" fill="#e0821a"/>

    <!-- half-segment marker -->
    <line x1="82.5" y1="14" x2="82.5" y2="26" stroke="#e0821a" stroke-width="1"/>
    <text x="82.5" y="-8" fill="#e0821a" font-size="12" text-anchor="middle">half the segment</text>
    <line x1="82.5" y1="-2" x2="82.5" y2="14" stroke="#e0821a" stroke-width="1" stroke-dasharray="2 2"/>

    <circle cx="15"  cy="20"  r="4" fill="#8a8f98"/>
    <circle cx="150" cy="20"  r="4" fill="#8a8f98"/>
    <circle cx="150" cy="155" r="4" fill="#8a8f98"/>

    <text x="82" y="185" fill="#8a8f98" font-size="12" text-anchor="middle">maximum useful blend</text>
    <text x="82" y="202" fill="#8a8f98" font-size="12" text-anchor="middle">ask for more and it is clamped to this</text>
  </g>

  <!-- ============ legend ============ -->
  <g transform="translate(200,283)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="13" cy="0" r="3.5" fill="#8a8f98"/>
    <text x="34" y="4" fill="#8a8f98" font-size="12">waypoints you sent</text>

    <line x1="185" y1="0" x2="211" y2="0" stroke="#e0821a" stroke-width="3" stroke-linecap="round"/>
    <text x="219" y="4" fill="#8a8f98" font-size="12">path the tool actually takes</text>
  </g>
</svg>
