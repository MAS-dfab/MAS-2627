<svg width="100%" viewBox="0 0 300 350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Iteration</title>
<desc>A process step followed by a decision diamond; one branch loops back to the step, the other continues to the end.</desc>
<defs>
<marker id="itrArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="170" y="20" text-anchor="middle" font-size="13" font-weight="500" fill="#1A1A1A">Iteration</text>
<rect x="120" y="42" width="100" height="36" rx="18" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
<text x="170" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">start</text>
<rect x="100" y="112" width="140" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
<text x="170" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">do the thing</text>
<path d="M170 167 L238 207 L170 247 L102 207 Z" fill="#E8E6F8" stroke="#B0A9E8" stroke-width="0.5"/>
<text x="170" y="207" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#43399B">again?</text>
<rect x="120" y="287" width="100" height="36" rx="18" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
<text x="170" y="305" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">end</text>
<line x1="170" y1="78" x2="170" y2="108" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#itrArrow)"/>
<line x1="170" y1="156" x2="170" y2="163" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#itrArrow)"/>
<line x1="170" y1="247" x2="170" y2="283" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#itrArrow)"/>
<path d="M102 207 L60 207 L60 134 L96 134" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#itrArrow)"/>
<text x="60" y="230" text-anchor="middle" font-size="12" fill="#6B6B6B">yes</text>
<text x="188" y="270" font-size="12" fill="#6B6B6B">no</text>
</svg>
