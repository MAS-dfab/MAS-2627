<svg width="100%" viewBox="0 0 340 390" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Conditional</title>
  <desc>A decision diamond splitting into two alternative process steps, which rejoin before the end terminator.</desc>
  <defs>
    <marker id="cndArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="170" y="20" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF">Conditional</text>

  <rect x="120" y="42" width="100" height="36" rx="18" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="170" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">start</text>

  <path d="M170 102 L232 142 L170 182 L108 142 Z" fill="#E8E6F8" stroke="#B0A9E8" stroke-width="0.5"/>
  <text x="170" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#43399B">true?</text>

  <rect x="40" y="207" width="100" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="90" y="229" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">do this</text>

  <rect x="200" y="207" width="100" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="250" y="229" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">do that</text>

  <rect x="120" y="312" width="100" height="36" rx="18" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="170" y="330" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">end</text>

  <line x1="170" y1="78" x2="170" y2="98" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cndArrow)"/>
  <path d="M108 142 L90 142 L90 203" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cndArrow)"/>
  <path d="M232 142 L250 142 L250 203" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cndArrow)"/>
  <path d="M90 251 L90 287 L170 287" fill="none" stroke="#6B6B6B" stroke-width="1.5"/>
  <path d="M250 251 L250 287 L170 287" fill="none" stroke="#6B6B6B" stroke-width="1.5"/>
  <line x1="170" y1="287" x2="170" y2="308" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#cndArrow)"/>

  <text x="82" y="170" text-anchor="end" font-size="12" fill="#FFFFFF">yes</text>
  <text x="260" y="170" font-size="12" fill="#FFFFFF">no</text>
</svg>
