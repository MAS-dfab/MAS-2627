<svg width="100%" viewBox="0 0 480 278" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>A box with a label on it</title>
  <desc>A label reading name attached to a box holding the value MAS, with three separate lines of code reading from that same box.</desc>
  <style>
    .ink   { fill: #1A1A1A; }
    .muted { fill: #6B6B6B; }
    .wire  { stroke: #6B6B6B; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #FFFFFF; }
      .muted { fill: #FFFFFF; }
      .wire  { stroke: #9A9A95; }
    }
  </style>
  <defs>
    <marker id="varArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="wire" d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="500" class="ink" fill="#1A1A1A">A box with a label on it</text>
  <path d="M24 66 L92 66 L108 81 L92 96 L24 96 Z" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="58" y="81" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">name</text>
  <line class="wire" x1="108" y1="81" x2="119" y2="81" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#varArrow)"/>
  <rect x="121" y="58" width="120" height="46" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="181" y="81" text-anchor="middle" dominant-baseline="central" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">&quot;MAS&quot;</text>
  <text x="181" y="122" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">one box, one value</text>
  <path class="wire" d="M241 81 L268 81 L268 223" fill="none" stroke="#6B6B6B" stroke-width="1.5"/>
  <line class="wire" x1="268" y1="143" x2="298" y2="143" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#varArrow)"/>
  <rect x="300" y="128" width="160" height="30" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="380" y="143" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">print(name)</text>
  <line class="wire" x1="268" y1="183" x2="298" y2="183" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#varArrow)"/>
  <rect x="300" y="168" width="160" height="30" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="380" y="183" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">print(&quot;hello&quot; + name)</text>
  <line class="wire" x1="268" y1="223" x2="298" y2="223" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#varArrow)"/>
  <rect x="300" y="208" width="160" height="30" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="380" y="223" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">print(name * 3)</text>
  <text x="380" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">three places that read it</text>
  <text x="240" y="270" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">Change what is in the box once — all three follow.</text>
</svg>
