<svg width="100%" viewBox="0 0 420 352" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>One number to rule them all</title>
  <desc>A single value, rows, feeding two relationships that combine on every pass to produce a pyramid.</desc>
  <style>
    .ink   { fill: #1A1A1A; }
    .muted { fill: #6B6B6B; }
    .wire  { stroke: #6B6B6B; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #FFFFFF; }
      .muted { fill: #FFFFFF; }
      .wire  { stroke: #9A9A95; }
    }
  </style>
  <defs>
    <marker id="prmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="wire" d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="210" y="22" text-anchor="middle" font-size="13" font-weight="500" class="ink" fill="#1A1A1A">One number to rule them all</text>
  <rect x="150" y="44" width="120" height="30" rx="15" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="210" y="59" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">rows = 8</text>
  <path class="wire" d="M210 74 L210 92 L70 92 L70 106" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#prmArrow)"/>
  <path class="wire" d="M210 74 L210 92 L350 92 L350 106" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#prmArrow)"/>
  <rect x="10" y="110" width="120" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="70" y="125" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3D3D3A">spaces</text>
  <text x="70" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">&quot; &quot; * (rows - i)</text>
  <rect x="290" y="110" width="120" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="350" y="125" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3D3D3A">stars</text>
  <text x="350" y="142" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">&quot;*&quot; * (2*i + 1)</text>
  <path class="wire" d="M70 154 L70 178 L210 178 L210 194" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#prmArrow)"/>
  <path class="wire" d="M350 154 L350 178 L210 178 L210 194" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#prmArrow)"/>
  <rect x="120" y="198" width="180" height="32" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="210" y="214" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">print(spaces + stars)</text>
  <line class="wire" x1="210" y1="230" x2="210" y2="250" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#prmArrow)"/>
  <text x="210" y="264" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">*</text>
  <text x="210" y="279" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">***</text>
  <text x="210" y="294" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">*****</text>
  <text x="210" y="309" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">*******</text>
  <text x="210" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">*********</text>
  <text x="210" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">Change the 8. Every row recalculates itself.</text>
</svg>
