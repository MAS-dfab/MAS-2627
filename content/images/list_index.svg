<svg width="100%" viewBox="0 0 470 268" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Everything in its right place</title>
  <desc>Seven symbols in a row with their index numbers underneath, and a span showing that len reports how many there are.</desc>
  <style>
    .ink   { fill: #1A1A1A; }
    .muted { fill: #6B6B6B; }
    .wire  { stroke: #6B6B6B; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #FFFFFF; }
      .muted { fill: #FFFFFF; }
      .wire  { stroke: #9A9A95; }
    }
  </style>
  <defs>
    <marker id="lstArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="wire" d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="235" y="22" text-anchor="middle" font-size="13" font-weight="500" class="ink" fill="#1A1A1A">Everything in its right place</text>
  <rect x="34" y="86" width="52" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="60" y="108" text-anchor="middle" dominant-baseline="central" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">.</text>
  <text x="60" y="146" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">0</text>
  <rect x="92" y="86" width="52" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="118" y="108" text-anchor="middle" dominant-baseline="central" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">:</text>
  <text x="118" y="146" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">1</text>
  <rect x="150" y="86" width="52" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="176" y="108" text-anchor="middle" dominant-baseline="central" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">-</text>
  <text x="176" y="146" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">2</text>
  <rect x="208" y="86" width="52" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="234" y="108" text-anchor="middle" dominant-baseline="central" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">=</text>
  <text x="234" y="146" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">3</text>
  <rect x="266" y="86" width="52" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="292" y="108" text-anchor="middle" dominant-baseline="central" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">+</text>
  <text x="292" y="146" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">4</text>
  <rect x="324" y="86" width="52" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="350" y="108" text-anchor="middle" dominant-baseline="central" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">*</text>
  <text x="350" y="146" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">5</text>
  <rect x="382" y="86" width="52" height="44" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="408" y="108" text-anchor="middle" dominant-baseline="central" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">#</text>
  <text x="408" y="146" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">6</text>
  <text x="60" y="56" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">symbols[0]</text>
  <line class="wire" x1="60" y1="66" x2="60" y2="82" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#lstArrow)"/>
  <text x="234" y="56" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">symbols[3]</text>
  <line class="wire" x1="234" y1="66" x2="234" y2="82" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#lstArrow)"/>
  <path class="wire" d="M34 172 L434 172" fill="none" stroke="#6B6B6B" stroke-width="1.5"/>
  <path class="wire" d="M34 166 L34 178" fill="none" stroke="#6B6B6B" stroke-width="1.5"/>
  <path class="wire" d="M434 166 L434 178" fill="none" stroke="#6B6B6B" stroke-width="1.5"/>
  <text x="234" y="192" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="ink" fill="#1A1A1A">len(symbols)  is  7</text>
  <text x="235" y="224" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">Counting starts at zero, so the last index is 6, not 7.</text>
  <text x="235" y="242" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">Add an item and the loop runs once more — you do not touch the loop.</text>
</svg>
