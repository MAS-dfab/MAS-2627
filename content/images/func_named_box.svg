<svg width="100%" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Naming an operation</title>
  <desc>Three calls with different arguments entering one definition, and the three different lines it prints coming out.</desc>
  <style>
    .ink   { fill: #1A1A1A; }
    .muted { fill: #6B6B6B; }
    .wire  { stroke: #6B6B6B; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #FFFFFF; }
      .muted { fill: #FFFFFF; }
      .wire  { stroke: #9A9A95; }
    }
  </style>
  <defs>
    <marker id="fnArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="wire" d="M2 1L8 5L2 9" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="280" y="22" text-anchor="middle" font-size="13" font-weight="500" class="ink" fill="#1A1A1A">Naming an operation</text>
  <text x="85" y="48" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">you call it</text>
  <text x="280" y="48" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">defined once</text>
  <text x="475" y="48" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">it prints</text>
  <rect x="190" y="104" width="180" height="52" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="280" y="120" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">draw_line(symbol, width)</text>
  <text x="280" y="141" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">print(symbol * width)</text>
  <rect x="10" y="62" width="150" height="32" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="85" y="78" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">draw_line(&quot;*&quot;, 20)</text>
  <path class="wire" d="M160 78 L175 78 L175 130 L188 130" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#fnArrow)"/>
  <path class="wire" d="M370 130 L385 130 L385 78 L398 78" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#fnArrow)"/>
  <rect x="400" y="62" width="150" height="32" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="475" y="78" text-anchor="middle" dominant-baseline="central" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">********************</text>
  <rect x="10" y="114" width="150" height="32" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="85" y="130" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">draw_line(&quot;-&quot;, 10)</text>
  <line class="wire" x1="160" y1="130" x2="188" y2="130" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#fnArrow)"/>
  <line class="wire" x1="370" y1="130" x2="398" y2="130" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#fnArrow)"/>
  <rect x="400" y="114" width="150" height="32" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="475" y="130" text-anchor="middle" dominant-baseline="central" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">----------</text>
  <rect x="10" y="166" width="150" height="32" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="85" y="182" text-anchor="middle" dominant-baseline="central" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">draw_line(&quot;*&quot;, 20)</text>
  <path class="wire" d="M160 182 L175 182 L175 130 L188 130" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#fnArrow)"/>
  <path class="wire" d="M370 130 L385 130 L385 182 L398 182" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#fnArrow)"/>
  <rect x="400" y="166" width="150" height="32" rx="3" fill="#F0F0EE" stroke="#C9C9C4" stroke-width="0.5"/>
  <text x="475" y="182" text-anchor="middle" dominant-baseline="central" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#3D3D3A">********************</text>
  <text x="280" y="228" text-anchor="middle" dominant-baseline="central" font-size="11" class="muted" fill="#6B6B6B">symbol and width are what you decided to leave open.</text>
</svg>
